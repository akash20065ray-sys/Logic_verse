<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="auto" style="font-family: 'Times New Roman', Times, serif; background: #ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
    <filter id="soft-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title / Outer IEEE Box -->
  <rect x="2" y="2" width="696" height="376" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>

  <!-- ================= LAYER 1: CLIENT PRESENTATION (TOP) ================= -->
  <g id="layer-presentation">
    <rect x="14" y="14" width="672" height="74" rx="3" fill="#f8fafc" stroke="#475569" stroke-width="0.8" stroke-dasharray="3,2"/>
    <text x="24" y="28" font-size="9" font-weight="bold" fill="#0f172a" letter-spacing="0.5">LAYER 1: REACTIVE USER INTERFACE &amp; INTERACTIVE WORKSPACE (NEXT.JS 16 / REACT 19)</text>
    
    <!-- Box 1A: Node-Wire Canvas -->
    <rect x="24" y="36" width="316" height="42" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1" filter="url(#soft-shadow)"/>
    <text x="32" y="50" font-size="8.5" font-weight="bold" fill="#0369a1">Visual Node-Wire Graph Canvas (@xyflow/react)</text>
    <text x="32" y="63" font-size="7.5" fill="#334155">&bull; Set Nodes (A, B) &bull; Logic Gates (&and;, &or;, &rarr;) &bull; Automata States (DFA/NFA)</text>
    <text x="32" y="73" font-size="7.5" fill="#334155">&bull; Pushdown LIFO Stack Probes &bull; Infinite 2-Way Turing Machine Tape</text>

    <!-- Box 1B: Dock Analytics -->
    <rect x="350" y="36" width="326" height="42" rx="3" fill="#ffffff" stroke="#7c3aed" stroke-width="1" filter="url(#soft-shadow)"/>
    <text x="358" y="50" font-size="8.5" font-weight="bold" fill="#6d28d9">Dock Inspection &amp; Analytical Verification Panels</text>
    <text x="358" y="63" font-size="7.5" fill="#334155">&bull; Venn Cardinality Probes &bull; Truth Tables (DNF/CNF) &bull; Adjacency Matrix</text>
    <text x="358" y="73" font-size="7.5" fill="#334155">&bull; Hasse Poset Reductions &bull; Warshall Closures &bull; CYK Parse Table</text>
  </g>

  <!-- Connectors Layer 1 to Layer 2 -->
  <path d="M 182 88 L 182 108" stroke="#0284c7" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
  <path d="M 513 88 L 513 108" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

  <!-- ================= LAYER 2: REACTIVE AST & EVALUATION ENGINE ================= -->
  <g id="layer-evaluator">
    <rect x="14" y="110" width="672" height="78" rx="3" fill="#f1f5f9" stroke="#334155" stroke-width="1"/>
    <text x="24" y="124" font-size="9" font-weight="bold" fill="#0f172a" letter-spacing="0.5">LAYER 2: CLIENT-SIDE REACTIVE DAG &amp; AST EVALUATION ENGINE (SUB-MILLISECOND EXECUTION)</text>

    <!-- Sub-module 2A -->
    <rect x="24" y="132" width="154" height="46" rx="2.5" fill="#ffffff" stroke="#64748b" stroke-width="0.8"/>
    <text x="30" y="145" font-size="8" font-weight="bold" fill="#0f172a">Sets &amp; Logic Compiler</text>
    <text x="30" y="157" font-size="7" fill="#475569">&bull; DAG Topological Sort</text>
    <text x="30" y="167" font-size="7" fill="#475569">&bull; Cycle &amp; Error Detection</text>
    <text x="30" y="175" font-size="7" fill="#475569">&bull; Tautology Verification</text>

    <!-- Sub-module 2B -->
    <rect x="186" y="132" width="158" height="46" rx="2.5" fill="#ffffff" stroke="#64748b" stroke-width="0.8"/>
    <text x="192" y="145" font-size="8" font-weight="bold" fill="#0f172a">Relations &amp; Posets</text>
    <text x="192" y="157" font-size="7" fill="#475569">&bull; Adjacency Matrix Tests</text>
    <text x="192" y="167" font-size="7" fill="#475569">&bull; Transitive Reduction (Hasse)</text>
    <text x="192" y="175" font-size="7" fill="#475569">&bull; Warshall Reachability</text>

    <!-- Sub-module 2C -->
    <rect x="352" y="132" width="158" height="46" rx="2.5" fill="#ffffff" stroke="#64748b" stroke-width="0.8"/>
    <text x="358" y="145" font-size="8" font-weight="bold" fill="#0f172a">Automata Algorithms</text>
    <text x="358" y="157" font-size="7" fill="#475569">&bull; &epsilon;-NFA to DFA Powerset 2^Q</text>
    <text x="358" y="167" font-size="7" fill="#475569">&bull; Hopcroft Partition Minimizer</text>
    <text x="358" y="175" font-size="7" fill="#475569">&bull; Interactive Step Simulation</text>

    <!-- Sub-module 2D -->
    <rect x="518" y="132" width="158" height="46" rx="2.5" fill="#ffffff" stroke="#64748b" stroke-width="0.8"/>
    <text x="524" y="145" font-size="8" font-weight="bold" fill="#0f172a">Grammars &amp; Computability</text>
    <text x="524" y="157" font-size="7" fill="#475569">&bull; 4-Step CNF Normalization</text>
    <text x="524" y="167" font-size="7" fill="#475569">&bull; CYK Dynamic Parser O(n&sup3;)</text>
    <text x="524" y="175" font-size="7" fill="#475569">&bull; TM 2-Way Tape Head Control</text>
  </g>

  <!-- Connectors Layer 2 to Layer 3 -->
  <path d="M 350 188 L 350 206" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="358" y="201" font-size="7.5" font-style="italic" fill="#475569">AST State Serialization</text>

  <!-- ================= LAYER 3: CONTEXT INGESTION BUS ================= -->
  <g id="layer-context">
    <rect x="14" y="208" width="672" height="30" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="0.8"/>
    <text x="24" y="222" font-size="8" font-weight="bold" fill="#0f172a">LAYER 3: BI-DIRECTIONAL CANVAS CONTEXT INGESTION BUS</text>
    <text x="24" y="233" font-size="7" fill="#334155">Transmits: { Module ID, Active Topology, Node Elements, Step Index, Input String, Formula AST, Truth Values }</text>
  </g>

  <!-- Connector Layer 3 to Layer 4 -->
  <path d="M 350 238 L 350 256" stroke="#0f172a" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- ================= LAYER 4: LOGICAI DUAL-ENGINE TUTOR ================= -->
  <g id="layer-tutor">
    <rect x="14" y="258" width="672" height="110" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
    <text x="24" y="272" font-size="9" font-weight="bold" fill="#0f172a" letter-spacing="0.5">LAYER 4: LOGICAI DUAL-ENGINE INTELLIGENT TUTORING SYSTEM</text>

    <!-- Dispatch Router -->
    <rect x="24" y="280" width="134" height="78" rx="2.5" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
    <text x="30" y="295" font-size="8" font-weight="bold" fill="#0f172a">Intent Classifier</text>
    <text x="30" y="308" font-size="7" fill="#475569">&bull; Regex Entity Extraction</text>
    <text x="30" y="319" font-size="7" fill="#475569">&bull; Combinatorial Matcher</text>
    <text x="30" y="330" font-size="7" fill="#475569">&bull; Theory/Hint Classifier</text>
    <text x="30" y="348" font-size="7" font-weight="bold" fill="#0369a1">&rarr; Deterministic vs LLM</text>

    <!-- Branch A: Tier 1 -->
    <path d="M 158 305 L 180 305" stroke="#059669" stroke-width="1.2" marker-end="url(#arrow)"/>
    <rect x="182" y="280" width="224" height="78" rx="2.5" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
    <text x="190" y="295" font-size="8" font-weight="bold" fill="#065f46">Tier 1: Deterministic Symbolic Solver</text>
    <text x="190" y="307" font-size="7" font-weight="bold" fill="#047857">&bull; 100% Exact Arithmetic (0.0% Hallucination)</text>
    <text x="190" y="318" font-size="7" fill="#065f46">&bull; Bell Numbers B(n) (Set Partitions)</text>
    <text x="190" y="328" font-size="7" fill="#065f46">&bull; Relations: 2^(n(n-1)), 2^(n(n+1)/2), 2^n &times; 3^(...)</text>
    <text x="190" y="338" font-size="7" fill="#065f46">&bull; Functions: Injective P(n, m), Bijective n!, n^m</text>
    <text x="190" y="348" font-size="7" fill="#065f46">&bull; Truth Table Rows 2^n &amp; Combinations C(n, k)</text>

    <!-- Branch B: Tier 2 -->
    <path d="M 158 335 L 420 335" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#arrow-purple)"/>
    <rect x="422" y="280" width="254" height="42" rx="2.5" fill="#faf5ff" stroke="#7c3aed" stroke-width="1"/>
    <text x="430" y="295" font-size="8" font-weight="bold" fill="#5b21b6">Tier 2: Grounded LLM Layer (Gemini / Groq / OpenAI)</text>
    <text x="430" y="307" font-size="7" fill="#6d28d9">&bull; Greedy Decoding (temp = 0.0) &bull; Zero Stochastic Drift</text>
    <text x="430" y="317" font-size="7" fill="#6d28d9">&bull; Context-Injected Step Explanations &bull; Induction Proof Ladders</text>

    <!-- Sanitizer Box -->
    <path d="M 549 322 L 549 332" stroke="#d97706" stroke-width="1" marker-end="url(#arrow)"/>
    <rect x="422" y="332" width="254" height="26" rx="2" fill="#fffbeb" stroke="#d97706" stroke-width="0.9"/>
    <text x="430" y="343" font-size="7.5" font-weight="bold" fill="#92400e">Universal Human-Readable Mathematical Sanitizer</text>
    <text x="430" y="353" font-size="6.8" fill="#78350f">Purges $, $$, \frac, \mathcal{P} &rarr; Clean Unicode (A &cap; B, 2^n, P(n,m))</text>
  </g>
</svg>