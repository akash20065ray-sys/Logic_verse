  <text x="460" y="70" font-size="7.5" fill="#64748b" text-anchor="end">Grid: 20px &#8226; Zoom: 100% &#8226; Nodes: 4, Edges: 5</text>

  <!-- Canvas Elements: DFA State Graph for L = { w | w contains 'ab' } -->
  <!-- State q0 (Start State) -->
  <circle cx="70" cy="140" r="18" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="70" y="144" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">q&#8320;</text>
  <!-- Initial Arrow -->
  <line x1="28" y1="140" x2="52" y2="140" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-arrow)"/>
  <text x="36" y="134" font-size="7.5" font-style="italic" fill="#475569">start</text>
  <!-- Self Loop q0 on b -->
  <path d="M 64 122 C 55 95 85 95 76 122" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr-arrow)"/>
  <text x="70" y="100" font-size="8.5" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>

  <!-- Transition q0 -> q1 on a -->
  <line x1="88" y1="140" x2="162" y2="140" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-arrow)"/>
  <text x="125" y="132" font-size="9" font-weight="bold" fill="#1e293b" text-anchor="middle">a</text>

  <!-- State q1 -->
  <circle cx="180" cy="140" r="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="180" y="144" font-size="10" font-weight="bold" fill="#1e40af" text-anchor="middle">q&#8321;</text>
  <!-- Self Loop q1 on a -->
  <path d="M 174 122 C 165 95 195 95 186 122" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr-arrow)"/>
  <text x="180" y="100" font-size="8.5" font-weight="bold" fill="#1e293b" text-anchor="middle">a</text>

  <!-- Transition q1 -> q2 on b -->
  <line x1="198" y1="140" x2="272" y2="140" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arr-arrow)"/>
  <text x="235" y="132" font-size="9" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>

  <!-- State q2 (Accept State: Double Circle) -->
  <circle cx="290" cy="140" r="18" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="290" cy="140" r="14" fill="none" stroke="#059669" stroke-width="1.2"/>
  <text x="290" y="144" font-size="10" font-weight="bold" fill="#065f46" text-anchor="middle">q&#8322;</text>
