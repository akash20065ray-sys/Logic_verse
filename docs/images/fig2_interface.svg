  <path d="M 284 122 C 275 95 305 95 296 122" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr-arrow)"/>
  <text x="290" y="100" font-size="8.5" font-weight="bold" fill="#1e293b" text-anchor="middle">a, b</text>

  <!-- Dynamic Wire Connection to Set Subsystem Node -->
  <!-- Set Node A -->
  <rect x="30" y="210" width="100" height="42" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1"/>
  <rect x="30" y="210" width="100" height="14" fill="#eff6ff"/>
