<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 395" width="100%" height="auto" style="background:#ffffff; font-family:'Times New Roman',Times,serif;">
  <defs>
    <marker id="arr3-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arr3-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="2" y="2" width="416" height="391" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <rect x="2" y="2" width="416" height="20" rx="2" fill="#1e293b"/>
  <circle cx="12" cy="11" r="3" fill="#ef4444"/>
  <circle cx="20" cy="11" r="3" fill="#f59e0b"/>
  <circle cx="28" cy="11" r="3" fill="#10b981"/>
  <text x="210" y="14.5" font-size="9.5" fill="#f8fafc" text-anchor="middle" font-weight="bold">LogicVerse Multi-Dock Workspace Interface (v0.1)</text>

  <!-- Module Selector Ribbon -->
  <rect x="2" y="22" width="416" height="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="10" y="34.5" font-size="8.5" fill="#1d4ed8" font-weight="bold">&#10003; 1. Sets</text>
  <text x="75" y="34.5" font-size="8.5" fill="#475569">&#10003; 2. Logic</text>
  <text x="145" y="34.5" font-size="8.5" fill="#475569">&#10003; 3. Relations</text>
  <text x="230" y="34.5" font-size="8.5" fill="#0f172a" font-weight="bold">&#9654; 4. Automata &amp; TM</text>
  <text x="408" y="34.5" font-size="8" fill="#047857" font-weight="bold" text-anchor="end">Engine: Active (0.18 ms)</text>

  <!-- ==================== DOCK A: TOPOLOGICAL CANVAS ==================== -->
  <rect x="8" y="44" width="404" height="142" rx="2" fill="#fafafa" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="8" y="44" width="404" height="17" fill="#e2e8f0"/>
  <text x="14" y="56" font-size="9" font-weight="bold" fill="#0f172a">Dock A: Reactive Graph Canvas &bull; DFA for L = {w | w contains 'ab'}</text>

  <!-- Start Arrow -->
  <line x1="20" y1="108" x2="42" y2="108" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr3-arrow)"/>
  <text x="22" y="102" font-size="8" font-style="italic" fill="#475569">start</text>

  <!-- State q0 -->
  <circle cx="58" cy="108" r="16" fill="#ffffff" stroke="#1e293b" stroke-width="1.4"/>
  <text x="58" y="112" font-size="10.5" font-weight="bold" fill="#0f172a" text-anchor="middle">q&#8320;</text>
  <!-- Loop q0 on b -->
  <path d="M 52 92 C 42 70 74 70 64 92" fill="none" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr3-arrow)"/>
  <text x="58" y="68" font-size="9" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>

  <!-- Transition q0 -> q1 on 'a' -->
  <line x1="74" y1="108" x2="164" y2="108" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr3-arrow)"/>
  <text x="119" y="103" font-size="9.5" font-weight="bold" fill="#2563eb" text-anchor="middle">a</text>

  <!-- State q1 -->
  <circle cx="180" cy="108" r="16" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="180" y="112" font-size="10.5" font-weight="bold" fill="#1e40af" text-anchor="middle">q&#8321;</text>
  <!-- Loop q1 on a -->
  <path d="M 174 92 C 164 70 196 70 186 92" fill="none" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arr3-blue)"/>
  <text x="180" y="68" font-size="9" font-weight="bold" fill="#2563eb" text-anchor="middle">a</text>

  <!-- Transition q1 -> q2 on 'b' -->
  <line x1="196" y1="108" x2="286" y2="108" stroke="#059669" stroke-width="1.4" marker-end="url(#arr3-arrow)"/>
  <text x="241" y="103" font-size="9.5" font-weight="bold" fill="#059669" text-anchor="middle">b (Accepted)</text>

  <!-- State q2 (Accepting: double circle) -->
  <circle cx="304" cy="108" r="17" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="304" cy="108" r="13" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <text x="304" y="112" font-size="10.5" font-weight="bold" fill="#047857" text-anchor="middle">q&#8322;</text>
  <!-- Loop q2 on a,b -->
  <path d="M 298 91 C 288 69 320 69 310 91" fill="none" stroke="#059669" stroke-width="1.2" marker-end="url(#arr3-arrow)"/>
  <text x="304" y="67" font-size="9" font-weight="bold" fill="#059669" text-anchor="middle">a, b</text>

  <!-- Canvas Status Footer -->
  <rect x="8" y="168" width="404" height="18" fill="#f1f5f9"/>
  <text x="14" y="180" font-size="8" fill="#475569">Status: <tspan fill="#059669" font-weight="bold">DFA Deterministic &amp; Minimal (Hopcroft)</tspan> &bull; States: |Q|=3 &bull; Alphabet: &Sigma;={a, b}</text>
  <text x="404" y="180" font-size="8" fill="#2563eb" text-anchor="end" font-weight="bold">Lead: Akash Kumar</text>

  <!-- ==================== DOCK B & C: PROBES & LOGICAI ==================== -->
  <!-- Dock B: Telemetry Probe -->
  <rect x="8" y="192" width="198" height="194" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="8" y="192" width="198" height="17" fill="#e2e8f0"/>
  <text x="14" y="204" font-size="8.5" font-weight="bold" fill="#0f172a">Dock B: Mathematical Probe</text>

  <rect x="14" y="215" width="186" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="20" y="227" font-size="8" font-weight="bold" fill="#1e293b">Formal Automaton 5-Tuple:</text>
  <text x="20" y="238" font-size="7.5" fill="#334155">&bull; Q = {q&#8320;, q&#8321;, q&#8322;}, &Sigma; = {a, b}</text>
  <text x="20" y="249" font-size="7.5" fill="#334155">&bull; Start: q&#8320; &bull; Final: F = {q&#8322;}</text>
  <text x="20" y="260" font-size="7.5" fill="#047857" font-weight="bold">&bull; Language: Regular (Chomsky Type 3)</text>

  <!-- Turing Simulation Box -->
  <rect x="14" y="272" width="186" height="52" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="20" y="284" font-size="8" font-weight="bold" fill="#1e293b">Turing Machine Tape Simulation:</text>
  <text x="20" y="295" font-size="7.5" fill="#334155">&bull; Transition: &delta;(q, a) = (p, b, R)</text>
  <text x="20" y="306" font-size="7.5" fill="#334155">&bull; Tape Head Position: Cell [3] = 'b'</text>
  <text x="20" y="317" font-size="7.5" fill="#047857" font-weight="bold">&bull; Step Count: 14 &bull; Halts: q_accept</text>

  <rect x="14" y="328" width="186" height="50" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="20" y="340" font-size="8" font-weight="bold" fill="#1e293b">Pushdown Automata (PDA) Stack:</text>
  <text x="20" y="351" font-size="7.5" fill="#334155">&bull; Instantaneous Description (ID):</text>
  <text x="20" y="362" font-size="7.5" fill="#334155">&emsp;(q&#8320;, bba, Z&#8320;) &vdash; (q&#8321;, ba, aZ&#8320;)</text>
  <text x="20" y="373" font-size="7.5" fill="#047857" font-weight="bold">&bull; Acceptance: Empty Stack &amp; Final</text>

  <!-- Dock C: Grounded LogicAI Chatbot -->
  <rect x="214" y="192" width="198" height="194" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="214" y="192" width="198" height="17" fill="#1e293b"/>
  <text x="220" y="204" font-size="8.5" font-weight="bold" fill="#ffffff">Dock C: LogicAI Dual-Engine Tutor</text>

  <!-- User Query -->
  <rect x="220" y="215" width="186" height="34" rx="2" fill="#eff6ff" stroke="#bfdbfe" stroke-width="0.6"/>
  <text x="226" y="226" font-size="7.5" font-weight="bold" fill="#1e40af">Student Query:</text>
  <text x="226" y="238" font-size="7.5" fill="#1e293b">"Why is state q&#8322; accepting for 'aab'?"</text>

  <!-- Tier 1 Grounded Execution -->
  <rect x="220" y="254" width="186" height="42" rx="2" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="0.6"/>
  <text x="226" y="265" font-size="7.5" font-weight="bold" fill="#047857">Tier 1 AST Solver (Deterministic):</text>
  <text x="226" y="276" font-size="7.2" fill="#065f46">&bull; Path: q&#8320; --a&rarr; q&#8321; --a&rarr; q&#8321; --b&rarr; q&#8322;</text>
  <text x="226" y="287" font-size="7.2" fill="#047857" font-weight="bold">&bull; Verified: q&#8322; &isin; F &rArr; Accepted in 0.12 ms</text>

  <!-- Tier 2 Socratic Guidance -->
  <rect x="220" y="300" width="186" height="60" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="226" y="311" font-size="7.5" font-weight="bold" fill="#1e293b">Tier 2 Grounded Socratic Dialogue:</text>
  <text x="226" y="322" font-size="7.2" fill="#334155">"Notice that the substring 'ab' completes</text>
  <text x="226" y="333" font-size="7.2" fill="#334155">on the final transition into q&#8322;. Once in</text>
  <text x="226" y="344" font-size="7.2" fill="#334155">q&#8322;, all subsequent symbols loop safely."</text>
  <text x="226" y="354" font-size="7.2" fill="#2563eb" font-weight="bold">&bull; Soundness: 100% Guaranteed Grounded</text>

  <!-- LogicAI Input Bar -->
  <rect x="220" y="365" width="186" height="15" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="226" y="375" font-size="7.2" fill="#94a3b8" font-style="italic">Ask LogicAI a mathematical question...</text>
</svg>