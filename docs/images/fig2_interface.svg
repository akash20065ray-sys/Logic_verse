<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="auto" style="background:#ffffff; font-family:'Times New Roman',Times,serif;">
  <defs>
    <marker id="arr-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
  </defs>

  <!-- Outer Window Border -->
  <rect x="2" y="2" width="416" height="536" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  
  <!-- Window Header Bar -->
  <rect x="2" y="2" width="416" height="20" rx="3" fill="#1e293b"/>
  <circle cx="12" cy="11" r="3" fill="#ef4444"/>
  <circle cx="20" cy="11" r="3" fill="#f59e0b"/>
  <circle cx="28" cy="11" r="3" fill="#10b981"/>
  <text x="210" y="14" font-size="8.5" fill="#f8fafc" text-anchor="middle" font-weight="bold">LogicVerse Multi-Dock Educational IDE (v0.1)</text>

  <!-- Module Selector Strip -->
  <rect x="2" y="22" width="416" height="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="10" y="34" font-size="7.5" fill="#1d4ed8" font-weight="bold">&#10003; 1. Sets</text>
  <text x="65" y="34" font-size="7.5" fill="#475569">&#10003; 2. Logic</text>
  <text x="125" y="34" font-size="7.5" fill="#475569">&#10003; 3. Relations</text>
  <text x="200" y="34" font-size="7.5" fill="#1e293b" font-weight="bold">&#9654; 4. Automata (DFA)</text>
  <text x="320" y="34" font-size="7" fill="#047857" font-weight="bold">Engine: Reactive (0.18 ms)</text>

  <!-- ========================================================================= -->
  <!-- DOCK A: TOPOLOGICAL CANVAS SUBSTRATE (HEIGHT: 170px)                     -->
  <!-- ========================================================================= -->
  <rect x="8" y="44" width="404" height="166" rx="2" fill="#fafafa" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="8" y="44" width="404" height="15" fill="#e2e8f0"/>
  <text x="14" y="55" font-size="7.5" font-weight="bold" fill="#0f172a">Dock A: Reactive Topological Canvas (DFA for L = {w | w contains 'ab'})</text>

  <!-- DFA Nodes & Transitions -->
  <!-- State q0 -->
  <circle cx="60" cy="98" r="15" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <text x="60" y="102" font-size="8.5" font-weight="bold" fill="#0f172a" text-anchor="middle">q&#8320;</text>
  <line x1="26" y1="98" x2="45" y2="98" stroke="#1e293b" stroke-width="1.2" marker-end="url(#arr-arrow)"/>
  <text x="32" y="93" font-size="6.5" font-style="italic" fill="#475569">start</text>
  <!-- Loop q0 on b -->
  <path d="M 54 83 C 46 64 74 64 66 83" fill="none" stroke="#1e293b" stroke-width="1.1" marker-end="url(#arr-arrow)"/>
  <text x="60" y="68" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>

  <!-- Edge q0 -> q1 on a -->
  <line x1="75" y1="98" x2="135" y2="98" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr-arrow)"/>
  <text x="105" y="92" font-size="8" font-weight="bold" fill="#1e293b" text-anchor="middle">a</text>

  <!-- State q1 -->
  <circle cx="150" cy="98" r="15" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="150" y="102" font-size="8.5" font-weight="bold" fill="#1e40af" text-anchor="middle">q&#8321;</text>
  <!-- Loop q1 on a -->
  <path d="M 144 83 C 136 64 164 64 156 83" fill="none" stroke="#1e293b" stroke-width="1.1" marker-end="url(#arr-arrow)"/>
  <text x="150" y="68" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="middle">a</text>

  <!-- Edge q1 -> q2 on b -->
  <line x1="165" y1="98" x2="225" y2="98" stroke="#1e293b" stroke-width="1.3" marker-end="url(#arr-arrow)"/>
  <text x="195" y="92" font-size="8" font-weight="bold" fill="#1e293b" text-anchor="middle">b</text>

  <!-- State q2 (Accept: Double Circle) -->
  <circle cx="240" cy="98" r="15" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <circle cx="240" cy="98" r="12" fill="none" stroke="#059669" stroke-width="1"/>
  <text x="240" y="102" font-size="8.5" font-weight="bold" fill="#065f46" text-anchor="middle">q&#8322;</text>
  <!-- Loop q2 on a,b -->
  <path d="M 234 83 C 226 64 254 64 246 83" fill="none" stroke="#1e293b" stroke-width="1.1" marker-end="url(#arr-arrow)"/>
  <text x="240" y="68" font-size="7.5" font-weight="bold" fill="#1e293b" text-anchor="middle">a, b</text>

  <!-- Connected Set Operations in Dock A -->
  <rect x="278" y="70" width="124" height="56" rx="2" fill="#ffffff" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="284" y="82" font-size="7" font-weight="bold" fill="#6d28d9">Set Node Binding</text>
  <text x="284" y="94" font-size="6.5" fill="#334155">A = {q&#8320;, q&#8321;}, B = {q&#8321;, q&#8322;}</text>
  <text x="284" y="106" font-size="6.5" fill="#1e40af" font-weight="bold">A &#8745; B = {q&#8321;} &#8594; |A &#8745; B| = 1</text>
  <text x="284" y="118" font-size="6.5" fill="#047857" font-weight="bold">Topological Sync: Verified</text>

  <!-- Simulation Tape Bar -->
  <rect x="18" y="142" width="384" height="60" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.7"/>
  <text x="24" y="154" font-size="7" font-weight="bold" fill="#0f172a">Execution Trace Inspector &#8226; Input String: w = "aab"</text>
  <rect x="28" y="162" width="20" height="20" fill="#e2e8f0" stroke="#64748b" stroke-width="0.6"/>
  <text x="38" y="175" font-size="8" font-weight="bold" fill="#64748b" text-anchor="middle">a</text>
  <rect x="48" y="162" width="20" height="20" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="58" y="175" font-size="8" font-weight="bold" fill="#b45309" text-anchor="middle">a</text>
  <text x="58" y="193" font-size="6" font-weight="bold" fill="#b45309" text-anchor="middle">&#9650; Step 2</text>
  <rect x="68" y="162" width="20" height="20" fill="#ffffff" stroke="#64748b" stroke-width="0.6"/>
  <text x="78" y="175" font-size="8" font-weight="bold" fill="#0f172a" text-anchor="middle">b</text>
  <text x="110" y="175" font-size="7" fill="#047857" font-weight="bold">State: q&#8321; &#8594; Status: Reachable &#8594; Valid Path</text>

  <!-- ========================================================================= -->
  <!-- DOCK B: SYNCHRONIZED ANALYTICAL PROBES (HEIGHT: 130px)                    -->
  <!-- ========================================================================= -->
  <rect x="8" y="214" width="404" height="126" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="8" y="214" width="404" height="15" fill="#e2e8f0"/>
  <text x="14" y="225" font-size="7.5" font-weight="bold" fill="#0f172a">Dock B: Synchronized Analytical Probes &amp; Invariant Health</text>

  <!-- Probe 1: Venn Diagram -->
  <rect x="16" y="234" width="186" height="98" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="22" y="246" font-size="7" font-weight="bold" fill="#1e293b">Venn Intersection Probe: |A &#8745; B|</text>
  <circle cx="85" cy="285" r="24" fill="#93c5fd" fill-opacity="0.5" stroke="#1d4ed8" stroke-width="1"/>
  <circle cx="115" cy="285" r="24" fill="#c4b5fd" fill-opacity="0.5" stroke="#6d28d9" stroke-width="1"/>
  <text x="75" y="287" font-size="6.8" font-weight="bold" fill="#1e40af">q&#8320;</text>
  <text x="100" y="287" font-size="6.8" font-weight="bold" fill="#0f172a">q&#8321;</text>
  <text x="125" y="287" font-size="6.8" font-weight="bold" fill="#5b21b6">q&#8322;</text>
  <text x="22" y="324" font-size="6.5" fill="#475569">|A| = 2, |B| = 2, |A &#8746; B| = 3, |A &#8745; B| = 1</text>

  <!-- Probe 2: State Transition Table -->
  <rect x="210" y="234" width="192" height="98" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.6"/>
  <text x="216" y="246" font-size="7" font-weight="bold" fill="#1e293b">Transition Matrix &#948;(q, &#963;) &amp; Minimality</text>
  <rect x="216" y="252" width="180" height="12" fill="#e2e8f0"/>
  <text x="226" y="261" font-size="6.5" font-weight="bold" fill="#0f172a">State</text>
  <text x="280" y="261" font-size="6.5" font-weight="bold" fill="#0f172a">&#948;(q, a)</text>
  <text x="340" y="261" font-size="6.5" font-weight="bold" fill="#0f172a">&#948;(q, b)</text>
  <text x="226" y="274" font-size="6.5" fill="#334155">&#8594; q&#8320;</text>
  <text x="280" y="274" font-size="6.5" fill="#1e40af" font-weight="bold">q&#8321;</text>
  <text x="340" y="274" font-size="6.5" fill="#334155">q&#8320;</text>
  <text x="226" y="286" font-size="6.5" fill="#334155">q&#8321;</text>
  <text x="280" y="286" font-size="6.5" fill="#334155">q&#8321;</text>
  <text x="340" y="286" font-size="6.5" fill="#047857" font-weight="bold">q&#8322;</text>
  <text x="226" y="298" font-size="6.5" fill="#047857" font-weight="bold">* q&#8322;</text>
  <text x="280" y="298" font-size="6.5" fill="#334155">q&#8322;</text>
  <text x="340" y="298" font-size="6.5" fill="#334155">q&#8322;</text>
  <text x="216" y="322" font-size="6.5" fill="#047857" font-weight="bold">&#10003; Determinism: 100% &#8226; Hopcroft Minimality: 3 States</text>

  <!-- ========================================================================= -->
  <!-- DOCK C: LOGICAI GROUNDED TUTOR (HEIGHT: 180px)                            -->
  <!-- ========================================================================= -->
  <rect x="8" y="344" width="404" height="186" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="8" y="344" width="404" height="15" fill="#1e293b"/>
  <text x="14" y="355" font-size="7.5" font-weight="bold" fill="#ffffff">Dock C: LogicAI Dual-Engine Grounded Intelligent Tutor</text>

  <!-- Student Query -->
  <rect x="16" y="364" width="388" height="26" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="22" y="375" font-size="6.8" font-weight="bold" fill="#475569">Student:</text>
  <text x="65" y="375" font-size="6.8" fill="#0f172a">"How many reflexive relations exist on a set with n = 4 elements?"</text>

  <!-- Tier 1 Response -->
  <rect x="16" y="394" width="388" height="54" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.7"/>
  <text x="22" y="405" font-size="6.8" font-weight="bold" fill="#1e40af">LogicAI (Tier 1 Deterministic Symbolic Solver — Exact Combinatorics):</text>
  <text x="22" y="417" font-size="6.6" fill="#1e3a8a">Formula: 2^(n(n - 1)). For n = 4: exponent = 4 &#215; 3 = 12 &#8594; Total = 2^12 = 4,096 relations.</text>
  <text x="22" y="428" font-size="6.5" fill="#475569">(Directly avoids LLM token drift; commercial models frequently hallucinate 2^16 or 65,536).</text>
  <text x="22" y="440" font-size="6.5" fill="#047857" font-weight="bold">&#10003; 100.0% Exact Arithmetic Guarantee &#8226; 0.0% Hallucination Rate</text>

  <!-- Student Follow-up -->
  <rect x="16" y="452" width="388" height="22" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
  <text x="22" y="464" font-size="6.8" font-weight="bold" fill="#475569">Student:</text>
  <text x="65" y="464" font-size="6.8" fill="#0f172a">"Is state q1 minimal in my active canvas DFA?"</text>

  <!-- Tier 2 Response -->
  <rect x="16" y="478" width="388" height="46" rx="2" fill="#faf5ff" stroke="#d8b4fe" stroke-width="0.7"/>
  <text x="22" y="489" font-size="6.8" font-weight="bold" fill="#7c3aed">LogicAI (Tier 2 Workspace-Grounded Socratic LLM — S_canvas Ingested):</text>
  <text x="22" y="501" font-size="6.6" fill="#4c1d95">&#8226; Inspecting live canvas topology: from q&#8321;, input 'b' reaches accept state q&#8322;, but from q&#8320;, 'b' self-loops.</text>
  <text x="22" y="512" font-size="6.6" fill="#4c1d95">Because &#948;(q&#8320;, b) &#8800; &#948;(q&#8321;, b), they belong to distinct 1-equivalence classes &#8594; q&#8321; is non-redundant.</text>
</svg>
