  <text x="299" y="41.5" font-size="8" fill="#475569" text-anchor="middle">&#10003; 3. Binary Relations</text>
  <rect x="360" y="30" width="120" height="16" rx="2" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <text x="420" y="41.5" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">&#9654; 4. Automata &amp; DFA</text>
  <rect x="486" y="30" width="120" height="16" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.5"/>
  <text x="546" y="41.5" font-size="8" fill="#475569" text-anchor="middle">5. Grammars &amp; CYK</text>
  <text x="880" y="41.5" font-size="7.5" fill="#047857" font-weight="bold" text-anchor="end">Engine Status: Reactive (0.18 ms)</text>

  <!-- ========================================================================= -->
  <!-- DOCK A: INTERACTIVE GRAPH CANVAS (LEFT: 460px)                            -->
  <!-- ========================================================================= -->
  <rect x="10" y="56" width="460" height="354" fill="#fafafa" stroke="#cbd5e1" stroke-width="0.8"/>
