<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="auto" style="background:#ffffff; font-family:'Times New Roman',Times,serif;">
  <!-- Outer Border -->
  <rect x="2" y="2" width="896" height="356" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>

  <!-- ========================================================================= -->
  <!-- PANEL A: PRE-TEST VS POST-TEST NORMALIZED GAIN (LEFT: 440px)               -->
  <!-- ========================================================================= -->
  <g id="panel-a">
    <rect x="12" y="12" width="430" height="336" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="22" y="28" font-size="9" font-weight="bold" fill="#0f172a">(a) Pedagogical Learning Gain &amp; Conceptual Mastery (N = 48)</text>
    <text x="22" y="40" font-size="7.5" fill="#475569" font-style="italic">Between-subjects randomized trial: Control (Textbooks + JFLAP) vs. Experimental (LogicVerse)</text>

    <!-- Chart Axes -->
    <!-- Y-axis: 0 to 100 -->
    <line x1="60" y1="260" x2="410" y2="260" stroke="#334155" stroke-width="1"/>
    <line x1="60" y1="60" x2="60" y2="260" stroke="#334155" stroke-width="1"/>

    <!-- Y Grid lines & ticks -->
    <!-- 0 -->
    <line x1="56" y1="260" x2="410" y2="260" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="50" y="263" font-size="7.5" fill="#475569" text-anchor="end">0</text>
    <!-- 25 -->
    <line x1="56" y1="210" x2="410" y2="210" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="50" y="213" font-size="7.5" fill="#475569" text-anchor="end">25</text>
    <!-- 50 -->
    <line x1="56" y1="160" x2="410" y2="160" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="50" y="163" font-size="7.5" fill="#475569" text-anchor="end">50</text>
    <!-- 75 -->
    <line x1="56" y1="110" x2="410" y2="110" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="50" y="113" font-size="7.5" fill="#475569" text-anchor="end">75</text>
    <!-- 100 -->
    <line x1="56" y1="60" x2="410" y2="60" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="50" y="63" font-size="7.5" fill="#475569" text-anchor="end">100</text>
    <text x="24" y="160" font-size="8" fill="#1e293b" font-weight="bold" transform="rotate(-90 24 160)" text-anchor="middle">Score (0 &#8211; 100)</text>

    <!-- Bars for Control Group (N=24) -->
    <!-- Pre-test: 42.4 (height = 42.4 * 2 = 84.8 => y = 260 - 85 = 175) -->
    <rect x="95" y="175" width="46" height="85" fill="#94a3b8" stroke="#475569" stroke-width="0.8"/>
    <!-- Error bar: +/- 8.7 (17.4px) -->
    <line x1="118" y1="158" x2="118" y2="192" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="110" y1="158" x2="126" y2="158" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="110" y1="192" x2="126" y2="192" stroke="#0f172a" stroke-width="1.2"/>
    <text x="118" y="152" font-size="7.5" fill="#0f172a" text-anchor="middle" font-weight="bold">42.4 &#177; 8.7</text>

    <!-- Post-test: 61.9 (height = 61.9 * 2 = 123.8 => y = 260 - 124 = 136) -->
    <rect x="145" y="136" width="46" height="124" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
    <!-- Error bar: +/- 10.4 (20.8px) -->
    <line x1="168" y1="115" x2="168" y2="157" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="160" y1="115" x2="176" y2="115" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="160" y1="157" x2="176" y2="157" stroke="#0f172a" stroke-width="1.2"/>
    <text x="168" y="108" font-size="7.5" fill="#0f172a" text-anchor="middle" font-weight="bold">61.9 &#177; 10.4</text>
    <text x="143" y="276" font-size="8" fill="#334155" text-anchor="middle" font-weight="bold">Control Group (N = 24)</text>
    <text x="143" y="288" font-size="7.5" fill="#475569" text-anchor="middle">Gain: g = 0.34 &#177; 0.15</text>

    <!-- Bars for Experimental Group (LogicVerse N=24) -->
    <!-- Pre-test: 41.8 (height = 41.8 * 2 = 83.6 => y = 260 - 84 = 176) -->
    <rect x="260" y="176" width="46" height="84" fill="#93c5fd" stroke="#1d4ed8" stroke-width="0.8"/>
    <!-- Error bar: +/- 9.1 (18.2px) -->
    <line x1="283" y1="158" x2="283" y2="194" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="275" y1="158" x2="291" y2="158" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="275" y1="194" x2="291" y2="194" stroke="#0f172a" stroke-width="1.2"/>
    <text x="283" y="152" font-size="7.5" fill="#1e40af" text-anchor="middle" font-weight="bold">41.8 &#177; 9.1</text>

    <!-- Post-test: 81.4 (height = 81.4 * 2 = 162.8 => y = 260 - 163 = 97) -->
    <rect x="310" y="97" width="46" height="163" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.8"/>
    <!-- Error bar: +/- 7.8 (15.6px) -->
    <line x1="333" y1="81" x2="333" y2="113" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="325" y1="81" x2="341" y2="81" stroke="#0f172a" stroke-width="1.2"/>
    <line x1="325" y1="113" x2="341" y2="113" stroke="#0f172a" stroke-width="1.2"/>
    <text x="333" y="74" font-size="7.5" fill="#1e40af" text-anchor="middle" font-weight="bold">81.4 &#177; 7.8</text>
    <text x="308" y="276" font-size="8" fill="#1e40af" text-anchor="middle" font-weight="bold">LogicVerse Group (N = 24)</text>
    <text x="308" y="288" font-size="7.5" fill="#1d4ed8" text-anchor="middle" font-weight="bold">Gain: g = 0.68 &#177; 0.12</text>

    <!-- Statistical Significance Bracket -->
    <path d="M 168 95 L 168 85 L 333 85 L 333 95" fill="none" stroke="#0f172a" stroke-width="1"/>
    <text x="250" y="80" font-size="7.5" fill="#0f172a" font-weight="bold" text-anchor="middle">*** p &lt; 0.001, Cohen's d = 1.42 (Very Large Effect)</text>

    <!-- Legend -->
    <rect x="135" y="310" width="12" height="10" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <text x="152" y="318" font-size="7" fill="#334155">Pre-Test</text>
    <rect x="235" y="310" width="12" height="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5"/>
    <text x="252" y="318" font-size="7" fill="#334155">Post-Test (LogicVerse)</text>
  </g>

  <!-- ========================================================================= -->
  <!-- PANEL B: NASA-TLX COGNITIVE WORKLOAD (RIGHT: 430px)                        -->
  <!-- ========================================================================= -->
  <g id="panel-b">
    <rect x="456" y="12" width="432" height="336" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="466" y="28" font-size="9" font-weight="bold" fill="#0f172a">(b) NASA-TLX Standardized Cognitive Workload Offloading (0 &#8211; 100)</text>
    <text x="466" y="40" font-size="7.5" fill="#475569" font-style="italic">Lower score indicates superior cognitive offloading; Performance inverted (higher = better)</text>

    <!-- Horizontal Bar Chart -->
    <!-- Axes -->
    <line x1="560" y1="55" x2="560" y2="285" stroke="#334155" stroke-width="1"/>
    <line x1="560" y1="285" x2="860" y2="285" stroke="#334155" stroke-width="1"/>

    <!-- X-axis ticks (0, 25, 50, 75, 100) -->
    <text x="560" y="297" font-size="7" fill="#475569" text-anchor="middle">0</text>
    <line x1="635" y1="285" x2="635" y2="55" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="635" y="297" font-size="7" fill="#475569" text-anchor="middle">25</text>
    <line x1="710" y1="285" x2="710" y2="55" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="710" y="297" font-size="7" fill="#475569" text-anchor="middle">50</text>
    <line x1="785" y1="285" x2="785" y2="55" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="785" y="297" font-size="7" fill="#475569" text-anchor="middle">75</text>
    <line x1="860" y1="285" x2="860" y2="55" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="860" y="297" font-size="7" fill="#475569" text-anchor="middle">100</text>

    <!-- Scale: 3px per point. Width = val * 3 -->
    <!-- Dimension 1: Mental Demand (Control: 68.5, LV: 34.2 => -50.1%) -->
    <text x="554" y="74" font-size="7.5" fill="#0f172a" text-anchor="end" font-weight="bold">Mental Demand</text>
    <rect x="560" y="62" width="205.5" height="10" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <rect x="560" y="74" width="102.6" height="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5"/>
    <text x="670" y="82" font-size="7" fill="#047857" font-weight="bold">&#8722;50.1%</text>

    <!-- Dimension 2: Frustration (Control: 59.4, LV: 21.8 => -63.3%) -->
    <text x="554" y="112" font-size="7.5" fill="#0f172a" text-anchor="end" font-weight="bold">Frustration</text>
    <rect x="560" y="100" width="178.2" height="10" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <rect x="560" y="112" width="65.4" height="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5"/>
    <text x="632" y="120" font-size="7" fill="#047857" font-weight="bold">&#8722;63.3%</text>

    <!-- Dimension 3: Temporal Demand (Control: 58.2, LV: 31.4 => -46.0%) -->
    <text x="554" y="150" font-size="7.5" fill="#0f172a" text-anchor="end">Temporal Demand</text>
    <rect x="560" y="138" width="174.6" height="10" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <rect x="560" y="150" width="94.2" height="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5"/>
    <text x="660" y="158" font-size="7" fill="#047857" font-weight="bold">&#8722;46.0%</text>

    <!-- Dimension 4: Effort (Control: 64.8, LV: 38.6 => -40.4%) -->
    <text x="554" y="188" font-size="7.5" fill="#0f172a" text-anchor="end">Effort Invested</text>
    <rect x="560" y="176" width="194.4" height="10" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <rect x="560" y="188" width="115.8" height="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5"/>
    <text x="682" y="196" font-size="7" fill="#047857" font-weight="bold">&#8722;40.4%</text>

    <!-- Dimension 5: Physical Demand (Low baseline) -->
    <text x="554" y="226" font-size="7.5" fill="#0f172a" text-anchor="end">Physical Demand</text>
    <rect x="560" y="214" width="42" height="10" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <rect x="560" y="226" width="36" height="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5"/>
    <text x="605" y="234" font-size="7" fill="#475569">&#8722;14.3%</text>

    <!-- Dimension 6: Perceived Performance (Control: 54.2, LV: 84.6 => +56.1%) -->
    <text x="554" y="264" font-size="7.5" fill="#0f172a" text-anchor="end" font-weight="bold">Performance</text>
    <rect x="560" y="252" width="162.6" height="10" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <rect x="560" y="264" width="253.8" height="10" fill="#059669" stroke="#065f46" stroke-width="0.5"/>
    <text x="820" y="272" font-size="7" fill="#047857" font-weight="bold">+56.1%</text>

    <!-- Legend -->
    <rect x="580" y="314" width="12" height="10" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
    <text x="598" y="322" font-size="7.5" fill="#334155">Control (JFLAP + Paper)</text>
    <rect x="710" y="314" width="12" height="10" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="0.5"/>
    <text x="728" y="322" font-size="7.5" fill="#1e40af" font-weight="bold">LogicVerse (Synchronized Multi-Dock)</text>
  </g>
</svg>
