<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 375" width="100%" height="auto" style="background:#ffffff; font-family:'Times New Roman',Times,serif;">
  <!-- Outer Frame -->
  <rect x="2" y="2" width="416" height="371" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>

  <!-- ==================== PANEL A: LEARNING GAINS ==================== -->
  <g id="panel-a">
    <rect x="8" y="8" width="404" height="174" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="16" y="22" font-size="9.5" font-weight="bold" fill="#0f172a">(a) Pedagogical Learning Gain &amp; Mastery (N = 124 Cohort)</text>
    <text x="16" y="33" font-size="8" fill="#475569" font-style="italic">Control (Textbook + LLM) vs. Experimental (LogicVerse Grounded IDE)</text>

    <!-- Axes -->
    <line x1="45" y1="140" x2="385" y2="140" stroke="#334155" stroke-width="1"/>
    <line x1="45" y1="42" x2="45" y2="140" stroke="#334155" stroke-width="1"/>

    <!-- Y Ticks -->
    <text x="38" y="143" font-size="7.5" fill="#475569" text-anchor="end">0%</text>
    <line x1="42" y1="140" x2="385" y2="140" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="38" y="115" font-size="7.5" fill="#475569" text-anchor="end">25%</text>
    <line x1="42" y1="115" x2="385" y2="115" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="38" y="90" font-size="7.5" fill="#475569" text-anchor="end">50%</text>
    <line x1="42" y1="90" x2="385" y2="90" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="38" y="65" font-size="7.5" fill="#475569" text-anchor="end">75%</text>
    <line x1="42" y1="65" x2="385" y2="65" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="38" y="45" font-size="7.5" fill="#475569" text-anchor="end">100%</text>
    <line x1="42" y1="42" x2="385" y2="42" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- Control Bars -->
    <!-- Control Pre: 48.2% (h=46.3 => y=140-46=94) -->
    <rect x="70" y="94" width="42" height="46" fill="#94a3b8" stroke="#334155" stroke-width="0.8"/>
    <text x="91" y="87" font-size="8" fill="#0f172a" text-anchor="middle" font-weight="bold">48.2%</text>

    <!-- Control Post: 60.6% (h=58.2 => y=140-58=82) -->
    <rect x="116" y="82" width="42" height="58" fill="#64748b" stroke="#334155" stroke-width="0.8"/>
    <text x="137" y="75" font-size="8" fill="#0f172a" text-anchor="middle" font-weight="bold">60.6%</text>
    <text x="114" y="152" font-size="8" fill="#334155" text-anchor="middle">Control (N=62)</text>

    <!-- Experimental Bars -->
    <!-- Exp Pre: 47.8% (h=45.9 => y=140-46=94) -->
    <rect x="235" y="94" width="42" height="46" fill="#93c5fd" stroke="#1d4ed8" stroke-width="0.8"/>
    <text x="256" y="87" font-size="8" fill="#1e40af" text-anchor="middle" font-weight="bold">47.8%</text>

    <!-- Exp Post: 78.4% (h=75.3 => y=140-75=65) -->
    <rect x="281" y="65" width="42" height="75" fill="#2563eb" stroke="#1e40af" stroke-width="0.8"/>
    <text x="302" y="58" font-size="8.5" fill="#1e40af" text-anchor="middle" font-weight="bold">78.4%</text>
    <text x="279" y="152" font-size="8.5" fill="#1d4ed8" text-anchor="middle" font-weight="bold">LogicVerse (N=62)</text>

    <!-- Gain Legend -->
    <text x="382" y="80" font-size="8.5" fill="#047857" font-weight="bold" text-anchor="end">+28.4% Post-Test Gain (p &lt; 0.001)</text>
    <text x="382" y="93" font-size="8" fill="#047857" font-weight="bold" text-anchor="end">Normalized Gain &lang;g&rang; = 0.58 vs 0.24</text>
  </g>

  <!-- ==================== PANEL B: NASA-TLX WORKLOAD ==================== -->
  <g id="panel-b">
    <rect x="8" y="190" width="404" height="175" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8"/>
    <text x="16" y="204" font-size="9.5" font-weight="bold" fill="#0f172a">(b) NASA-TLX Cognitive Workload &amp; Usability Offloading</text>
    <text x="16" y="215" font-size="8" fill="#475569" font-style="italic">Lower workload score indicates reduced cognitive strain (Scale: 0 - 100)</text>

    <!-- Axes -->
    <line x1="120" y1="225" x2="120" y2="350" stroke="#334155" stroke-width="1"/>
    <line x1="120" y1="350" x2="385" y2="350" stroke="#334155" stroke-width="1"/>

    <!-- Scale ticks -->
    <text x="120" y="360" font-size="7" fill="#475569" text-anchor="middle">0</text>
    <text x="186" y="360" font-size="7" fill="#475569" text-anchor="middle">25</text>
    <line x1="186" y1="225" x2="186" y2="350" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="252" y="360" font-size="7" fill="#475569" text-anchor="middle">50</text>
    <line x1="252" y1="225" x2="252" y2="350" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="318" y="360" font-size="7" fill="#475569" text-anchor="middle">75</text>
    <line x1="318" y1="225" x2="318" y2="350" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="384" y="360" font-size="7" fill="#475569" text-anchor="middle">100</text>

    <!-- Row 1: Mental Demand -->
    <text x="114" y="240" font-size="8" fill="#0f172a" text-anchor="end" font-weight="bold">Mental Demand</text>
    <rect x="120" y="232" width="196" height="11" fill="#94a3b8" stroke="#475569" stroke-width="0.6"/>
    <text x="320" y="241" font-size="7.5" fill="#475569">74.2</text>
    <rect x="120" y="244" width="110" height="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.6"/>
    <text x="234" y="253" font-size="7.5" fill="#1e40af" font-weight="bold">41.5 (-44.1%)</text>

    <!-- Row 2: Frustration -->
    <text x="114" y="272" font-size="8" fill="#0f172a" text-anchor="end" font-weight="bold">Frustration</text>
    <rect x="120" y="264" width="181" height="11" fill="#94a3b8" stroke="#475569" stroke-width="0.6"/>
    <text x="305" y="273" font-size="7.5" fill="#475569">68.5</text>
    <rect x="120" y="276" width="85" height="11" fill="#2563eb" stroke="#1d4ed8" stroke-width="0.6"/>
    <text x="209" y="285" font-size="7.5" fill="#1e40af" font-weight="bold">32.1 (-53.1%)</text>

    <!-- Row 3: Overall Workload -->
    <text x="114" y="304" font-size="8" fill="#0f172a" text-anchor="end" font-weight="bold">Overall Workload</text>
    <rect x="120" y="296" width="180" height="11" fill="#94a3b8" stroke="#475569" stroke-width="0.6"/>
    <text x="304" y="305" font-size="7.5" fill="#475569">68.4</text>
    <rect x="120" y="308" width="103" height="11" fill="#059669" stroke="#047857" stroke-width="0.6"/>
    <text x="227" y="317" font-size="7.5" fill="#047857" font-weight="bold">39.2 (-42.6%)</text>

    <!-- Row 4: SUS Usability Score -->
    <text x="114" y="336" font-size="8" fill="#047857" text-anchor="end" font-weight="bold">SUS Usability Score</text>
    <rect x="120" y="328" width="154" height="11" fill="#cbd5e1" stroke="#475569" stroke-width="0.6"/>
    <text x="278" y="337" font-size="7.5" fill="#475569">58.2 (Grade C)</text>
    <rect x="120" y="340" width="234" height="11" fill="#10b981" stroke="#047857" stroke-width="0.6"/>
    <text x="358" y="349" font-size="7.5" fill="#047857" font-weight="bold">88.6 (Grade A+)</text>
  </g>
</svg>