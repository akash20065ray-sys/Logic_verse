<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="auto" style="background:#ffffff; font-family:'Times New Roman',Times,serif;">
  <defs>
    <marker id="pipe-arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <filter id="p-shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Border (IEEE Spec) -->
  <rect x="2" y="2" width="956" height="216" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1"/>

  <!-- Top Title Banner -->
  <rect x="2" y="2" width="956" height="18" fill="#1e293b"/>
  <text x="14" y="14.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="8" font-weight="bold" fill="#ffffff" letter-spacing="0.5">FORMAL CURRICULAR &amp; COMPUTATIONAL PIPELINE: FROM DISCRETE PRIMITIVES TO TURING COMPUTABILITY</text>
  <text x="946" y="14.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="7.5" fill="#cbd5e1" text-anchor="end">Continuous Mathematical Progression Architecture</text>

  <!-- ==================== STAGE 1: SET THEORY ==================== -->
  <g transform="translate(12, 28)">
    <rect x="0" y="0" width="176" height="146" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="0.8" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="176" height="18" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
    <text x="88" y="12.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="7.8" font-weight="bold" fill="#0f172a" text-anchor="middle">Stage 1: Set Theory</text>

    <!-- Sub-heading & Formalisms -->
    <text x="8" y="32" font-size="6.8" font-weight="bold" fill="#1e40af">Discrete Universe Foundations:</text>
    <text x="8" y="44" font-size="6.5" fill="#334155">&bull; Finite Universes A, B &sube; U</text>
    <text x="8" y="55" font-size="6.5" fill="#334155">&bull; Operators: &cup;, &cap;, &minus;, &oplus; (SymDiff)</text>
    <text x="8" y="66" font-size="6.5" fill="#334155">&bull; Power Set: |P(A)| = 2^|A|</text>
    <text x="8" y="77" font-size="6.5" fill="#334155">&bull; Cartesian Product: A &times; B</text>

    <line x1="8" y1="86" x2="168" y2="86" stroke="#cbd5e1" stroke-width="0.6"/>
    <text x="8" y="98" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.5" font-weight="bold" fill="#0f172a">Computational Engine:</text>
    <text x="8" y="109" font-size="6.2" fill="#475569">&bull; Topological DAG Evaluator</text>
    <text x="8" y="120" font-size="6.2" fill="#475569">&bull; Dynamic Multi-Set Venn Probes</text>
    <text x="8" y="132" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.2" font-weight="bold" fill="#047857">&bull; Sub-millisecond Cardinalities |S|</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 190 101 L 202 101" stroke="#1e293b" stroke-width="1.2" marker-end="url(#pipe-arr)"/>

  <!-- ==================== STAGE 2: BOOLEAN LOGIC ==================== -->
  <g transform="translate(204, 28)">
    <rect x="0" y="0" width="176" height="146" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="0.8" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="176" height="18" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
    <text x="88" y="12.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="7.8" font-weight="bold" fill="#0f172a" text-anchor="middle">Stage 2: Propositional Logic</text>

    <!-- Sub-heading & Formalisms -->
    <text x="8" y="32" font-size="6.8" font-weight="bold" fill="#1e40af">Truth Functional Calculus:</text>
    <text x="8" y="44" font-size="6.5" fill="#334155">&bull; Valuations &nu;: Var &rarr; {0, 1}</text>
    <text x="8" y="55" font-size="6.5" fill="#334155">&bull; Gates: &and;, &or;, &not;, &rarr;, &harr;, &oplus;</text>
    <text x="8" y="66" font-size="6.5" fill="#334155">&bull; 2^n Interpretation Space</text>
    <text x="8" y="77" font-size="6.5" fill="#334155">&bull; Tautology Verification &models; &phi;</text>

    <line x1="8" y1="86" x2="168" y2="86" stroke="#cbd5e1" stroke-width="0.6"/>
    <text x="8" y="98" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.5" font-weight="bold" fill="#0f172a">Computational Engine:</text>
    <text x="8" y="109" font-size="6.2" fill="#475569">&bull; Reactive AST Tree Compiler</text>
    <text x="8" y="120" font-size="6.2" fill="#475569">&bull; Canonical DNF / CNF Synthesis</text>
    <text x="8" y="132" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.2" font-weight="bold" fill="#047857">&bull; Semantic Equivalence Checker</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 382 101 L 394 101" stroke="#1e293b" stroke-width="1.2" marker-end="url(#pipe-arr)"/>

  <!-- ==================== STAGE 3: RELATIONS & POSETS ==================== -->
  <g transform="translate(396, 28)">
    <rect x="0" y="0" width="176" height="146" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="0.8" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="176" height="18" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
    <text x="88" y="12.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="7.8" font-weight="bold" fill="#0f172a" text-anchor="middle">Stage 3: Binary Relations &amp; Posets</text>

    <!-- Sub-heading & Formalisms -->
    <text x="8" y="32" font-size="6.8" font-weight="bold" fill="#1e40af">Discrete Binary Structures:</text>
    <text x="8" y="44" font-size="6.5" fill="#334155">&bull; Relations R &sube; A &times; A; Matrix M_R</text>
    <text x="8" y="55" font-size="6.5" fill="#334155">&bull; Reflexive, Symmetric, Transitive</text>
    <text x="8" y="66" font-size="6.5" fill="#334155">&bull; Equivalence Classes &amp; Partitions</text>
    <text x="8" y="77" font-size="6.5" fill="#334155">&bull; Posets &amp; Partially Ordered Sets</text>

    <line x1="8" y1="86" x2="168" y2="86" stroke="#cbd5e1" stroke-width="0.6"/>
    <text x="8" y="98" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.5" font-weight="bold" fill="#0f172a">Computational Engine:</text>
    <text x="8" y="109" font-size="6.2" fill="#475569">&bull; Hasse Transitive Reduction</text>
    <text x="8" y="120" font-size="6.2" fill="#475569">&bull; Warshall Reachability Closure W^(k)</text>
    <text x="8" y="132" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.2" font-weight="bold" fill="#047857">&bull; Tier 1 Exact Permutations 2^k</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 574 101 L 586 101" stroke="#1e293b" stroke-width="1.2" marker-end="url(#pipe-arr)"/>

  <!-- ==================== STAGE 4: AUTOMATA THEORY ==================== -->
  <g transform="translate(588, 28)">
    <rect x="0" y="0" width="176" height="146" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="0.8" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="176" height="18" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
    <text x="88" y="12.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="7.8" font-weight="bold" fill="#0f172a" text-anchor="middle">Stage 4: Automata Theory</text>

    <!-- Sub-heading & Formalisms -->
    <text x="8" y="32" font-size="6.8" font-weight="bold" fill="#1e40af">Finite State Transition Systems:</text>
    <text x="8" y="44" font-size="6.5" fill="#334155">&bull; 5-Tuple M = (Q, &Sigma;, &delta;, q0, F)</text>
    <text x="8" y="55" font-size="6.5" fill="#334155">&bull; Transition Relation: &delta; &sube; Q &times; &Sigma; &times; Q</text>
    <text x="8" y="66" font-size="6.5" fill="#334155">&bull; DFA, NFA, &amp; &epsilon;-NFA Machines</text>
    <text x="8" y="77" font-size="6.5" fill="#334155">&bull; Regular Languages &amp; RegEx Dual</text>

    <line x1="8" y1="86" x2="168" y2="86" stroke="#cbd5e1" stroke-width="0.6"/>
    <text x="8" y="98" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.5" font-weight="bold" fill="#0f172a">Computational Engine:</text>
    <text x="8" y="109" font-size="6.2" fill="#475569">&bull; Powerset Subset 2^Q Converter</text>
    <text x="8" y="120" font-size="6.2" fill="#475569">&bull; Hopcroft Minimizer O(|&Sigma;| n log n)</text>
    <text x="8" y="132" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.2" font-weight="bold" fill="#047857">&bull; Real-Time Step-by-Step String Trace</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 766 101 L 778 101" stroke="#1e293b" stroke-width="1.2" marker-end="url(#pipe-arr)"/>

  <!-- ==================== STAGE 5: GRAMMARS & COMPUTABILITY ==================== -->
  <g transform="translate(780, 28)">
    <rect x="0" y="0" width="168" height="146" rx="2" fill="#ffffff" stroke="#64748b" stroke-width="0.8" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="168" height="18" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
    <text x="84" y="12.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="7.8" font-weight="bold" fill="#0f172a" text-anchor="middle">Stage 5: Computability Theory</text>

    <!-- Sub-heading & Formalisms -->
    <text x="8" y="32" font-size="6.8" font-weight="bold" fill="#1e40af">Formal Languages &amp; Machines:</text>
    <text x="8" y="44" font-size="6.5" fill="#334155">&bull; Context-Free Grammars G = (V, &Sigma;, R, S)</text>
    <text x="8" y="55" font-size="6.5" fill="#334155">&bull; Chomsky Hierarchy Levels 3 &rarr; 0</text>
    <text x="8" y="66" font-size="6.5" fill="#334155">&bull; Pushdown Automata LIFO Stack</text>
    <text x="8" y="77" font-size="6.5" fill="#334155">&bull; Turing Machine Tape Decidability</text>

    <line x1="8" y1="86" x2="160" y2="86" stroke="#cbd5e1" stroke-width="0.6"/>
    <text x="8" y="98" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.5" font-weight="bold" fill="#0f172a">Computational Engine:</text>
    <text x="8" y="109" font-size="6.2" fill="#475569">&bull; 4-Step CNF Normalization</text>
    <text x="8" y="120" font-size="6.2" fill="#475569">&bull; CYK Dynamic Parser O(n&sup3;)</text>
    <text x="8" y="132" font-family="'Arial', 'Helvetica', sans-serif" font-size="6.2" font-weight="bold" fill="#047857">&bull; Unbounded Head Simulation</text>
  </g>

  <!-- Bottom Synthesis Banner -->
  <g transform="translate(12, 182)">
    <rect x="0" y="0" width="936" height="26" rx="2" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.75"/>
    <text x="12" y="16.5" font-family="'Arial', 'Helvetica', sans-serif" font-size="7" font-weight="bold" fill="#0f172a">Formal Mathematical Continuity Invariants Across the Curricular Pipeline:</text>
    <text x="365" y="16.5" font-size="6.8" fill="#334155">Set operations &cup;, &cap; &rarr; Boolean valuations &nu; &rarr; Cartesian product relation matrix M_R &rarr; State transition relation &delta; &sube; Q &times; &Sigma; &times; Q &rarr; Unbounded Turing tape &Gamma;</text>
  </g>

</svg>