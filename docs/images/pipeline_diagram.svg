<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 310" width="100%" height="auto" style="background:#ffffff; font-family:'Times New Roman',Times,serif;">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="arr2-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Outer Frame -->
  <rect x="2" y="2" width="416" height="306" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>

  <!-- Top Title Banner -->
  <rect x="2" y="2" width="416" height="19" fill="#1e293b"/>
  <text x="10" y="15" font-size="10" font-weight="bold" fill="#ffffff" letter-spacing="0.3">FORMAL CURRICULAR &amp; COMPUTATIONAL PIPELINE</text>
  <text x="408" y="15" font-size="8.5" fill="#cbd5e1" text-anchor="end" font-style="italic">7-Module Continuum</text>

  <!-- Row 1: Stage 1 & Stage 2 -->
  <!-- Stage 1: Set Theory -->
  <rect x="10" y="28" width="186" height="66" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
  <rect x="10" y="28" width="186" height="16" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
  <text x="16" y="40" font-size="9" font-weight="bold" fill="#0f172a">Stage 1: Set Theory</text>
  <text x="190" y="40" font-size="8" fill="#1e40af" text-anchor="end" font-style="italic">Sanskar (Backend)</text>
  <text x="16" y="55" font-size="8.5" fill="#334155">• Universes A, B &sube; U, Power Sets 2^|A|</text>
  <text x="16" y="68" font-size="8.5" fill="#334155">• Operations: &cup;, &cap;, \, &Delta;, Cartesian A &times; B</text>
  <text x="16" y="81" font-size="8.5" fill="#047857" font-weight="bold">• Sub-millisecond Bitmask Engine</text>

  <!-- Arrow S1 -> S2 -->
  <line x1="196" y1="61" x2="222" y2="61" stroke="#0f172a" stroke-width="1.3" marker-end="url(#arr2)"/>

  <!-- Stage 2: Propositional Logic -->
  <rect x="224" y="28" width="186" height="66" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
  <rect x="224" y="28" width="186" height="16" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
  <text x="230" y="40" font-size="9" font-weight="bold" fill="#0f172a">Stage 2: Propositional Logic</text>
  <text x="404" y="40" font-size="8" fill="#1e40af" text-anchor="end" font-style="italic">Ghansham (Frontend)</text>
  <text x="230" y="55" font-size="8.5" fill="#334155">• Truth Valuations: &not;, &and;, &or;, &rarr;, &harr;</text>
  <text x="230" y="68" font-size="8.5" fill="#334155">• 2^k Interpretation Space &amp; Tautologies</text>
  <text x="230" y="81" font-size="8.5" fill="#047857" font-weight="bold">• AST Tree Evaluator &amp; CNF/DNF</text>

  <!-- Arrow down from Row 1 to Row 2 -->
  <line x1="317" y1="94" x2="317" y2="108" stroke="#0f172a" stroke-width="1.3" marker-end="url(#arr2)"/>

  <!-- Row 2: Stage 3 & Stage 4 -->
  <!-- Stage 3: Relations & Posets -->
  <rect x="10" y="110" width="186" height="66" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
  <rect x="10" y="110" width="186" height="16" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
  <text x="16" y="122" font-size="9" font-weight="bold" fill="#0f172a">Stage 3: Relations &amp; Posets</text>
  <text x="190" y="122" font-size="8" fill="#1e40af" text-anchor="end" font-style="italic">Hari (Backend)</text>
  <text x="16" y="137" font-size="8.5" fill="#334155">• Equivalence Partitions A/R &amp; Closures</text>
  <text x="16" y="150" font-size="8.5" fill="#334155">• Warshall Transitive Closure O(|V|^3)</text>
  <text x="16" y="163" font-size="8.5" fill="#047857" font-weight="bold">• Topological Sorting &amp; Hasse Diagrams</text>

  <!-- Arrow S4 -> S3 (or S3 -> S4) -->
  <line x1="196" y1="143" x2="222" y2="143" stroke="#0f172a" stroke-width="1.3" marker-end="url(#arr2)"/>

  <!-- Stage 4: Regex & CFG -->
  <rect x="224" y="110" width="186" height="66" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
  <rect x="224" y="110" width="186" height="16" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
  <text x="230" y="122" font-size="9" font-weight="bold" fill="#0f172a">Stage 4: Regex &amp; Formal Grammars</text>
  <text x="404" y="122" font-size="8" fill="#1e40af" text-anchor="end" font-style="italic">Krishna (Frontend)</text>
  <text x="230" y="137" font-size="8.5" fill="#334155">• Thompson &amp; Glushkov Regex O(m)</text>
  <text x="230" y="150" font-size="8.5" fill="#334155">• Chomsky Normal Form (CNF) Conversion</text>
  <text x="230" y="163" font-size="8.5" fill="#047857" font-weight="bold">• CYK Dynamic Parse Table O(n^3)</text>

  <!-- Arrow down from Row 2 to Row 3 -->
  <line x1="103" y1="176" x2="103" y2="190" stroke="#0f172a" stroke-width="1.3" marker-end="url(#arr2)"/>

  <!-- Row 3: Stage 5: Automata Theory & Turing Computability -->
  <rect x="10" y="192" width="400" height="64" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
  <rect x="10" y="192" width="400" height="16" fill="#f1f5f9" stroke="#64748b" stroke-width="0.8"/>
  <text x="16" y="204" font-size="9.5" font-weight="bold" fill="#0f172a">Stage 5: Automata Theory &amp; Turing Computability</text>
  <text x="404" y="204" font-size="8.5" fill="#1e40af" text-anchor="end" font-style="italic">Akash Kumar (Full-Stack Lead)</text>
  
  <text x="16" y="220" font-size="8.5" fill="#334155">• DFA/NFA Subset Construction 2^|Q| &amp; Hopcroft Minimization O(n log n)</text>
  <text x="16" y="233" font-size="8.5" fill="#334155">• Pushdown Automata (PDA) LIFO Stack IDs (q, aw, X&alpha;) &vdash; (p, w, &beta;&alpha;)</text>
  <text x="16" y="246" font-size="8.5" fill="#047857" font-weight="bold">• Turing Machines &delta;(q, a) = (p, b, D) • Infinite Virtual Tape • Decider Loop Trapping</text>

  <!-- Arrow Row 3 -> Summary -->
  <line x1="210" y1="256" x2="210" y2="268" stroke="#0f172a" stroke-width="1.3" marker-end="url(#arr2-blue)"/>

  <!-- Row 4: Grounded LogicAI Synthesizer -->
  <rect x="10" y="270" width="400" height="30" rx="2" fill="#0f172a"/>
  <text x="210" y="284" font-size="9.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">GROUNDED LOGICAI SOCRATIC PEDAGOGICAL LAYER</text>
  <text x="210" y="295" font-size="8" fill="#f8fafc" text-anchor="middle">Full Context Serialization • Zero Hallucination Math • NASA-TLX 42.6% Cognitive Workload Reduction</text>
</svg>