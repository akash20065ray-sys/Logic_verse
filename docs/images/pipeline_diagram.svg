<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="auto" style="background:#ffffff; font-family:'Times New Roman',Times,serif;">
  <defs>
    <marker id="pipe-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <filter id="p-shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Border (IEEE Style) -->
  <rect x="2" y="2" width="896" height="226" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>

  <!-- Pipeline Track Connector Bar -->
  <line x1="80" y1="95" x2="820" y2="95" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ==================== STAGE 1: SET THEORY ==================== -->
  <g transform="translate(14, 12)">
    <rect x="0" y="0" width="160" height="168" rx="3" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="160" height="22" rx="3" fill="#e0f2fe"/>
    <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#0369a1" text-anchor="middle">1. Set Theory</text>

    <!-- Mini Venn Schematic -->
    <g transform="translate(42, 28)">
      <circle cx="26" cy="18" r="14" fill="#38bdf8" fill-opacity="0.3" stroke="#0284c7" stroke-width="0.8"/>
      <circle cx="46" cy="18" r="14" fill="#818cf8" fill-opacity="0.3" stroke="#4f46e5" stroke-width="0.8"/>
      <text x="18" y="21" font-size="6.5" font-weight="bold" fill="#0369a1">A</text>
      <text x="50" y="21" font-size="6.5" font-weight="bold" fill="#3730a3">B</text>
      <text x="27" y="21" font-size="6" font-weight="bold" fill="#0c4a6e">&cap;</text>
    </g>

    <text x="10" y="74" font-size="7" fill="#0f172a">&bull; Finite Sets A, B &sube; U</text>
    <text x="10" y="86" font-size="7" fill="#0f172a">&bull; Operations: &cup;, &cap;, &minus;, &oplus;</text>
    <text x="10" y="98" font-size="7" fill="#0f172a">&bull; Power Set |P(A)| = 2^|A|</text>
    <text x="10" y="110" font-size="7" fill="#0f172a">&bull; Cartesian Product A &times; B</text>

    <line x1="8" y1="120" x2="152" y2="120" stroke="#bae6fd" stroke-width="0.8"/>
    <text x="10" y="132" font-size="6.5" font-weight="bold" fill="#0284c7">Reactive Computation:</text>
    <text x="10" y="143" font-size="6.2" fill="#0369a1">Topological DAG Sorter</text>
    <text x="10" y="154" font-size="6.2" fill="#0369a1">&rarr; Exact Cardinality |S|</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 174 95 L 190 95" stroke="#0f172a" stroke-width="1.4" marker-end="url(#pipe-arrow)"/>

  <!-- ==================== STAGE 2: BOOLEAN LOGIC ==================== -->
  <g transform="translate(192, 12)">
    <rect x="0" y="0" width="160" height="168" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="160" height="22" rx="3" fill="#dbeafe"/>
    <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#1d4ed8" text-anchor="middle">2. Propositional Logic</text>

    <!-- Mini Logic Gate Schematic -->
    <g transform="translate(46, 28)">
      <line x1="10" y1="12" x2="26" y2="12" stroke="#1e40af" stroke-width="0.8"/>
      <line x1="10" y1="24" x2="26" y2="24" stroke="#1e40af" stroke-width="0.8"/>
      <path d="M 26 6 L 38 6 C 50 6, 50 30, 38 30 L 26 30 Z" fill="#ffffff" stroke="#1d4ed8" stroke-width="1"/>
      <text x="32" y="20" font-size="6.5" font-weight="bold" fill="#1e40af">&and;</text>
      <line x1="47" y1="18" x2="60" y2="18" stroke="#1e40af" stroke-width="0.8"/>
      <text x="2" y="14" font-size="6" fill="#1e3a8a">P</text>
      <text x="2" y="26" font-size="6" fill="#1e3a8a">Q</text>
      <text x="63" y="20" font-size="6" font-weight="bold" fill="#1e3a8a">P&and;Q</text>
    </g>

    <text x="10" y="74" font-size="7" fill="#0f172a">&bull; Valuations &nu;: Var &rarr; {0, 1}</text>
    <text x="10" y="86" font-size="7" fill="#0f172a">&bull; Gates: &and;, &or;, &not;, &rarr;, &harr;, &oplus;</text>
    <text x="10" y="98" font-size="7" fill="#0f172a">&bull; 2^n Interpretation Rows</text>
    <text x="10" y="110" font-size="7" fill="#0f172a">&bull; Tautology Check &models; &phi;</text>

    <line x1="8" y1="120" x2="152" y2="120" stroke="#bfdbfe" stroke-width="0.8"/>
    <text x="10" y="132" font-size="6.5" font-weight="bold" fill="#1d4ed8">AST Compiler:</text>
    <text x="10" y="143" font-size="6.2" fill="#1e40af">Canonical DNF / CNF Synthesizer</text>
    <text x="10" y="154" font-size="6.2" fill="#1e40af">&rarr; Semantic Equivalence</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 352 95 L 368 95" stroke="#0f172a" stroke-width="1.4" marker-end="url(#pipe-arrow)"/>

  <!-- ==================== STAGE 3: RELATIONS & POSETS ==================== -->
  <g transform="translate(370, 12)">
    <rect x="0" y="0" width="160" height="168" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="160" height="22" rx="3" fill="#ede9fe"/>
    <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#6d28d9" text-anchor="middle">3. Relations &amp; Posets</text>

    <!-- Mini Hasse Diagram Schematic -->
    <g transform="translate(48, 26)">
      <circle cx="32" cy="8" r="4" fill="#7c3aed"/>
      <circle cx="16" cy="22" r="4" fill="#a855f7"/>
      <circle cx="48" cy="22" r="4" fill="#a855f7"/>
      <circle cx="32" cy="36" r="4" fill="#c084fc"/>
      <line x1="32" y1="12" x2="18" y2="20" stroke="#6d28d9" stroke-width="0.8"/>
      <line x1="32" y1="12" x2="46" y2="20" stroke="#6d28d9" stroke-width="0.8"/>
      <line x1="18" y1="24" x2="30" y2="34" stroke="#6d28d9" stroke-width="0.8"/>
      <line x1="46" y1="24" x2="34" y2="34" stroke="#6d28d9" stroke-width="0.8"/>
    </g>

    <text x="10" y="74" font-size="7" fill="#0f172a">&bull; Discrete Relation R &sube; A &times; A</text>
    <text x="10" y="86" font-size="7" fill="#0f172a">&bull; Adjacency Matrix M_R [i, j]</text>
    <text x="10" y="98" font-size="7" fill="#0f172a">&bull; Reflexive, Symmetric, Trans.</text>
    <text x="10" y="110" font-size="7" fill="#0f172a">&bull; Poset Transitive Reduction</text>

    <line x1="8" y1="120" x2="152" y2="120" stroke="#ddd6fe" stroke-width="0.8"/>
    <text x="10" y="132" font-size="6.5" font-weight="bold" fill="#6d28d9">Closure Algorithms:</text>
    <text x="10" y="143" font-size="6.2" fill="#581c87">Warshall Reachability W^k</text>
    <text x="10" y="154" font-size="6.2" fill="#581c87">&rarr; Bell Partitions B(n)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 530 95 L 546 95" stroke="#0f172a" stroke-width="1.4" marker-end="url(#pipe-arrow)"/>

  <!-- ==================== STAGE 4: AUTOMATA THEORY ==================== -->
  <g transform="translate(548, 12)">
    <rect x="0" y="0" width="160" height="168" rx="3" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.2" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="160" height="22" rx="3" fill="#fae8ff"/>
    <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#a21caf" text-anchor="middle">4. Automata Theory</text>

    <!-- Mini 2-State Automaton Schematic -->
    <g transform="translate(32, 28)">
      <circle cx="22" cy="18" r="10" fill="#ffffff" stroke="#c026d3" stroke-width="1"/>
      <text x="18" y="21" font-size="7" font-weight="bold" fill="#a21caf">q0</text>
      <path d="M 2 18 L 12 18" stroke="#a21caf" stroke-width="1" marker-end="url(#arr-purple)"/>

      <path d="M 32 18 L 60 18" stroke="#c026d3" stroke-width="1.2" marker-end="url(#arr-purple)"/>
      <text x="44" y="13" font-size="6.5" font-weight="bold" fill="#86198f">a</text>

      <circle cx="72" cy="18" r="10" fill="#ffffff" stroke="#c026d3" stroke-width="1"/>
      <circle cx="72" cy="18" r="7.5" fill="none" stroke="#c026d3" stroke-width="0.8"/>
      <text x="68" y="21" font-size="7" font-weight="bold" fill="#a21caf">q1</text>
    </g>

    <text x="10" y="74" font-size="7" fill="#0f172a">&bull; 5-Tuple: (Q, &Sigma;, &delta;, q0, F)</text>
    <text x="10" y="86" font-size="7" fill="#0f172a">&bull; &delta; as Binary Relation over Q&times;&Sigma;</text>
    <text x="10" y="98" font-size="7" fill="#0f172a">&bull; &epsilon;-NFA &rarr; DFA Powerset 2^Q</text>
    <text x="10" y="110" font-size="7" fill="#0f172a">&bull; Hopcroft O(|&Sigma;| n log n)</text>

    <line x1="8" y1="120" x2="152" y2="120" stroke="#f5d0fe" stroke-width="0.8"/>
    <text x="10" y="132" font-size="6.5" font-weight="bold" fill="#a21caf">Execution Engine:</text>
    <text x="10" y="143" font-size="6.2" fill="#701a75">Live String Step Simulation</text>
    <text x="10" y="154" font-size="6.2" fill="#701a75">&rarr; Regular Language Parsing</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 708 95 L 724 95" stroke="#0f172a" stroke-width="1.4" marker-end="url(#pipe-arrow)"/>

  <!-- ==================== STAGE 5: COMPUTABILITY THEORY ==================== -->
  <g transform="translate(726, 12)">
    <rect x="0" y="0" width="160" height="168" rx="3" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2" filter="url(#p-shadow)"/>
    <rect x="0" y="0" width="160" height="22" rx="3" fill="#fce7f3"/>
    <text x="80" y="15" font-size="8.5" font-weight="bold" fill="#be185d" text-anchor="middle">5. Computability Theory</text>

    <!-- Mini PDA Stack & Turing Tape Schematic -->
    <g transform="translate(36, 26)">
      <!-- Stack -->
      <rect x="0" y="4" width="22" height="32" fill="#ffffff" stroke="#db2777" stroke-width="0.8"/>
      <rect x="2" y="7" width="18" height="8" fill="#fce7f3" stroke="#f472b6" stroke-width="0.5"/>
      <text x="8" y="13" font-size="5.5" font-weight="bold" fill="#9d174d">Z0</text>
      <rect x="2" y="16" width="18" height="8" fill="#fbcfe8" stroke="#f472b6" stroke-width="0.5"/>
      <text x="9" y="22" font-size="5.5" font-weight="bold" fill="#9d174d">$</text>
      <text x="1" y="42" font-size="6" fill="#be185d">PDA</text>

      <!-- Turing Tape -->
      <rect x="34" y="10" width="50" height="14" fill="#ffffff" stroke="#0f172a" stroke-width="0.7"/>
      <line x1="44" y1="10" x2="44" y2="24" stroke="#64748b" stroke-width="0.5"/>
      <line x1="54" y1="10" x2="54" y2="24" stroke="#64748b" stroke-width="0.5"/>
      <line x1="64" y1="10" x2="64" y2="24" stroke="#64748b" stroke-width="0.5"/>
      <line x1="74" y1="10" x2="74" y2="24" stroke="#64748b" stroke-width="0.5"/>
      <text x="36" y="20" font-size="6" fill="#0f172a">B</text>
      <text x="47" y="20" font-size="6" font-weight="bold" fill="#0f172a">1</text>
      <text x="57" y="20" font-size="6" font-weight="bold" fill="#0f172a">0</text>
      <text x="67" y="20" font-size="6" fill="#0f172a">B</text>
      <polygon points="59,5 56,9 62,9" fill="#0f172a"/>
      <text x="48" y="32" font-size="6" fill="#0f172a">Turing</text>
    </g>

    <text x="10" y="74" font-size="7" fill="#0f172a">&bull; Context-Free Grammars (CFG)</text>
    <text x="10" y="86" font-size="7" fill="#0f172a">&bull; 4-Step CNF Normalization</text>
    <text x="10" y="98" font-size="7" fill="#0f172a">&bull; CYK Dynamic Parser O(n&sup3;)</text>
    <text x="10" y="110" font-size="7" fill="#0f172a">&bull; Pushdown LIFO &amp; Tape Heads</text>

    <line x1="8" y1="120" x2="152" y2="120" stroke="#fbcfe8" stroke-width="0.8"/>
    <text x="10" y="132" font-size="6.5" font-weight="bold" fill="#be185d">Chomsky Hierarchy:</text>
    <text x="10" y="143" font-size="6.2" fill="#831843">Decidability Boundaries</text>
    <text x="10" y="154" font-size="6.2" fill="#831843">&rarr; Halting Problem Formalisms</text>
  </g>

  <!-- ==================== FORMAL CONTINUITY BRIDGES (BOTTOM) ==================== -->
  <g transform="translate(14, 188)">
    <rect x="0" y="0" width="872" height="34" rx="2" fill="#f8fafc" stroke="#64748b" stroke-width="0.8"/>
    <text x="12" y="14" font-size="7.5" font-weight="bold" fill="#0f172a">Formal Mathematical Continuity Bridges:</text>
    <text x="12" y="26" font-size="6.8" fill="#334155">
      &bull; Set algebra operations &cap;, &cup; define boolean valuations &nu; &bull; Cartesian product A &times; A grounds binary relation matrices M_R &bull; Relations formalize automata transition functions &delta; &sube; Q &times; &Sigma; &times; Q &bull; Finite automata generalize to unbounded PDA stack memory and Turing computability.
    </text>
  </g>

</svg>